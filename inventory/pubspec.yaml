name: inventory
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ✅ Supabase (REQUIRED)
  supabase_flutter: ^2.5.6

  # ✅ Image picker (for selecting computer images)
  image_picker: ^1.0.4
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
