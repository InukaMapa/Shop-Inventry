name: inventory
description: "TechZone - Advanced inventory management and shop tracking application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ✅ Supabase (REQUIRED)
  supabase_flutter: ^2.5.6

  # ✅ Image picker (for selecting computer images)
  image_picker: ^1.0.4
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  provider: ^6.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/tech_zone_logo_app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/tech_zone_logo_app_icon.png"
    background_color: "#ffffff"
    theme_color: "#000000"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
